name: Import old sites

# Run by hand from the Actions tab. Pulls developmentdepartment.org (Ghost)
# and fastdecisions.org (Super.so) into the repo and opens a pull request
# with the result, so nothing changes on main without review.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run import
      - run: npm run build
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: import/old-sites
          commit-message: Import content from developmentdepartment.org and fastdecisions.org
          title: Import content from the Ghost and Super.so sites
          body: |
            Automated import. See import-report.json for the page list, any failures, and pages whose body came out thin.
          add-paths: |
            src/content
            src/fast-decisions
            src/assets/images
            redirects
            import-report.json
