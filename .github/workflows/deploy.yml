name: Deploy to GitHub Pages

# Manual for now. GitHub Pages must be turned on for this repo
# (Settings > Pages > Source: GitHub Actions) before this can run.
# Until the domain switch, the site builds for
# maiernoah.github.io/developmentdepartment/. After the switch, set the
# repository variable PATH_PREFIX to "/" and change the trigger to push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX || '/developmentdepartment/' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
